[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edaptive"
version = "0.1.0"
description = "Framework for self-adaptive metaheuristic algorithms"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyQt5",
    "matplotlib",
    "scipy",
    "mpi4py",
    "scikit-posthocs",
    "coco-experiment",
    "opfunu==1.0.4",
    "setuptools<81",
]
[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["calypso", ".coco", ".coco-unpatched", "venv", "*.md"]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F), isort (I), pep8-naming (N), bugbear (B)
select = ["E", "W", "F", "I", "N", "B"]
# Literature notation (X, Y_hat, B, L, T_first, N_new, ...) is kept deliberately.
ignore = ["N802", "N803", "N806", "N815", "N816"]

[tool.ruff.lint.isort]
known-first-party = ["edaptive"]
